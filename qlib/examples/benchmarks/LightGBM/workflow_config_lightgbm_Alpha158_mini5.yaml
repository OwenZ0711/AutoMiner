qlib_init:
    provider_uri: "~/.qlib/qlib_data/cn_data_akshare"
    region: cn
market: &market stocks4
benchmark: &benchmark SH000300
data_handler_config: &data_handler_config
    start_time: 2019-01-01
    end_time: 2024-12-20
    fit_start_time: 2019-01-01
    fit_end_time: 2022-12-31
    instruments: *market
port_analysis_config: &port_analysis_config
    strategy:
        class: TopkDropoutStrategy
        module_path: qlib.contrib.strategy
        kwargs:
            signal: <PRED>
            topk: 2
            n_drop: 1
    backtest:
        start_time: 2024-01-01
        end_time: 2024-12-20
        account: 100000000
        benchmark: *benchmark
        exchange_kwargs:
            limit_threshold: 0.095
            deal_price: close
            open_cost: 0.0005
            close_cost: 0.0015
            min_cost: 5
task:
    model:
        class: LGBModel
        module_path: qlib.contrib.model.gbdt
        kwargs:
            loss: mse
            colsample_bytree: 0.8
            learning_rate: 0.05
            subsample: 0.8
            lambda_l1: 0.0
            lambda_l2: 0.1
            max_depth: 6
            num_leaves: 31
            num_threads: 4
    dataset:
        class: DatasetH
        module_path: qlib.data.dataset
        kwargs:
            handler:
                class: Alpha158
                module_path: qlib.contrib.data.handler
                kwargs: *data_handler_config
            segments:
                train: [2019-01-01, 2022-12-31]
                valid: [2023-01-01, 2023-06-30]
                test: [2023-07-01, 2024-12-20]
    record:
        - class: SignalRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            model: <MODEL>
            dataset: <DATASET>
        - class: SigAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            ana_long_short: False
            ann_scaler: 252
        - class: PortAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            config: *port_analysis_config
